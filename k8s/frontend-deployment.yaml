apiVersion: apps/v1
kind: Deployment
metadata:
  name: connect4-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: connect4-frontend
  template:
    metadata:
      labels:
        app: connect4-frontend
    spec:
      containers:
        - name: connect4-frontend
          image: ghcr.io/patflynn89/connect4-frontend:latest
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: connect4-frontend
spec:
  type: NodePort
  selector:
    app: connect4-frontend
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080
